name: run

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest
    env:
      LANG: en_US.UTF-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install xcpretty
        run: gem install --no-document xcpretty

      # - name: Resolve Swift packages
      #   run: swift package resolve

      - name: Build with xcodebuild
        run: |
          set -o pipefail
          xcodebuild -project Cribbot.xcodeproj \
            -scheme Cribbot \
            -destination 'generic/platform=iOS Simulator' \
            clean build | xcpretty --no-color
        shell: bash

  tests:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install xcpretty
        run: gem install --no-document xcpretty

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode-deriveddata-${{ hashFiles('**/*.swift', '**/*.xcodeproj') }}
          restore-keys: |
            ${{ runner.os }}-xcode-deriveddata-

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test -project Cribbot.xcodeproj \
            -scheme Cribbot \
            -destination 'platform=iOS Simulator,name=iPhone 17'
        shell: bash
